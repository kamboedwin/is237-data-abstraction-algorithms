<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450"><rect width="1100" height="450" rx="30" fill="#fbfcff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f9f"/></marker></defs><g font-family="Arial,sans-serif"><text x="550" y="52" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Queue: First In, First Out (FIFO)</text><text x="100" y="150" font-size="21" font-weight="700" fill="#8b591d">FRONT</text><text x="890" y="150" font-size="21" font-weight="700" fill="#1d654e">REAR</text><g fill="#fff" stroke="#3563a8" stroke-width="3"><rect x="150" y="180" width="160" height="95" rx="12"/><rect x="325" y="180" width="160" height="95" rx="12"/><rect x="500" y="180" width="160" height="95" rx="12"/><rect x="675" y="180" width="160" height="95" rx="12"/></g><g text-anchor="middle" font-size="23" font-weight="700" fill="#173a75"><text x="230" y="238">A</text><text x="405" y="238">B</text><text x="580" y="238">C</text><text x="755" y="238">D</text></g><path d="M145 330 H65" stroke="#bd7a27" stroke-width="5" marker-end="url(#a)"/><text x="150" y="365" font-size="20" font-weight="700" fill="#8b591d">DEQUEUE from front</text><path d="M870 225 H965" stroke="#2b765e" stroke-width="5" marker-end="url(#a)"/><text x="785" y="330" font-size="20" font-weight="700" fill="#1d654e">ENQUEUE at rear</text><text x="550" y="410" text-anchor="middle" font-size="18" fill="#526176">The earliest element waiting at the front is removed first.</text></g></svg>