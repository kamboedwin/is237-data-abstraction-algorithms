<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 520"><rect width="1150" height="520" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="575" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#17233c">ADT Behaviour Can Use Different Representations</text><rect x="70" y="90" width="470" height="350" rx="24" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="305" y="132" text-anchor="middle" font-size="25" font-weight="700" fill="#173a75">Stack ADT</text><text x="105" y="180" font-size="18" fill="#314158">Operations: push, pop, peek, isEmpty</text><text x="105" y="230" font-size="18" font-weight="700" fill="#173a75">Array implementation</text><text x="105" y="265" font-size="17" fill="#314158">• top index identifies current top</text><text x="105" y="300" font-size="17" fill="#314158">• may have capacity / resizing concerns</text><text x="105" y="345" font-size="18" font-weight="700" fill="#1d654e">Linked implementation</text><text x="105" y="380" font-size="17" fill="#314158">• head/top points to first node</text><text x="105" y="415" font-size="17" fill="#314158">• growth uses new nodes</text><rect x="610" y="90" width="470" height="350" rx="24" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="845" y="132" text-anchor="middle" font-size="25" font-weight="700" fill="#1d654e">Queue ADT</text><text x="645" y="180" font-size="18" fill="#314158">Operations: enqueue, dequeue, front, isEmpty</text><text x="645" y="230" font-size="18" font-weight="700" fill="#173a75">Circular array implementation</text><text x="645" y="265" font-size="17" fill="#314158">• front/rear indexes wrap around</text><text x="645" y="300" font-size="17" fill="#314158">• fixed capacity unless resized</text><text x="645" y="345" font-size="18" font-weight="700" fill="#1d654e">Linked implementation</text><text x="645" y="380" font-size="17" fill="#314158">• front and rear node references</text><text x="645" y="415" font-size="17" fill="#314158">• enqueue/dequeue can both be O(1)</text><text x="575" y="485" text-anchor="middle" font-size="18" fill="#526176">The ADT defines behaviour; the data structure determines implementation details and trade-offs.</text></g></svg>