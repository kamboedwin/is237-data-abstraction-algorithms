<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500"><rect width="1050" height="500" rx="30" fill="#f8fbff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f9f"/></marker></defs><g font-family="Arial,sans-serif"><text x="525" y="50" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Stack: Last In, First Out (LIFO)</text><g fill="#fff" stroke="#3563a8" stroke-width="3"><rect x="380" y="315" width="290" height="70" rx="12"/><rect x="380" y="235" width="290" height="70" rx="12"/><rect x="380" y="155" width="290" height="70" rx="12"/></g><g text-anchor="middle" font-size="24" font-weight="700" fill="#173a75"><text x="525" y="359">A — first pushed</text><text x="525" y="279">B</text><text x="525" y="199">C — top</text></g><path d="M770 95 V160" stroke="#2b765e" stroke-width="5" marker-end="url(#a)"/><text x="820" y="120" font-size="21" font-weight="700" fill="#1d654e">PUSH</text><path d="M280 160 V95" stroke="#bd7a27" stroke-width="5" marker-end="url(#a)"/><text x="190" y="120" font-size="21" font-weight="700" fill="#8b591d">POP</text><text x="525" y="445" text-anchor="middle" font-size="18" fill="#526176">Only the top end is used for ordinary insertion and removal.</text></g></svg>