<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520"><rect width="1160" height="520" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="580" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Quick Sort: Partition Around a Pivot</text><text x="580" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#173a75">[7, 2, 9, 4, 6] &#160; pivot = 6</text><rect x="95" y="165" width="400" height="180" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="295" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#1d654e">Values ≤ pivot</text><text x="295" y="270" text-anchor="middle" font-size="29" font-weight="700" fill="#1d654e">2 &#160; 4</text><rect x="530" y="165" width="140" height="180" rx="22" fill="#fff5e7" stroke="#bd7a27" stroke-width="3"/><text x="600" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#8b591d">pivot</text><text x="600" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#8b591d">6</text><rect x="705" y="165" width="360" height="180" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="885" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#173a75">Values &gt; pivot</text><text x="885" y="270" text-anchor="middle" font-size="29" font-weight="700" fill="#173a75">7 &#160; 9</text><text x="580" y="410" text-anchor="middle" font-size="19" fill="#526176">After partition, the pivot is in its final sorted position; recursively sort the left and right partitions.</text><text x="580" y="455" text-anchor="middle" font-size="18" fill="#526176">Good partitions give O(n log n) average time; highly unbalanced partitions can degrade to O(n²).</text></g></svg>