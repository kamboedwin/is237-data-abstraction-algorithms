<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520"><rect width="1180" height="520" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="590" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Five Core Sorting Algorithms</text><g fill="#fff" stroke-width="3"><rect x="55" y="110" width="200" height="280" rx="20" stroke="#3563a8"/><rect x="275" y="110" width="200" height="280" rx="20" stroke="#2b765e"/><rect x="495" y="110" width="200" height="280" rx="20" stroke="#bd7a27"/><rect x="715" y="110" width="200" height="280" rx="20" stroke="#8d4b86"/><rect x="935" y="110" width="190" height="280" rx="20" stroke="#b44d4d"/></g><g text-anchor="middle"><text x="155" y="150" font-size="23" font-weight="700" fill="#173a75">Bubble</text><text x="375" y="150" font-size="23" font-weight="700" fill="#1d654e">Selection</text><text x="595" y="150" font-size="23" font-weight="700" fill="#8b591d">Insertion</text><text x="815" y="150" font-size="23" font-weight="700" fill="#75386e">Merge</text><text x="1030" y="150" font-size="23" font-weight="700" fill="#873939">Quick</text><text x="155" y="205" font-size="17" fill="#314158">swap adjacent</text><text x="155" y="235" font-size="17" fill="#314158">out-of-order pairs</text><text x="375" y="205" font-size="17" fill="#314158">select minimum</text><text x="375" y="235" font-size="17" fill="#314158">place next</text><text x="595" y="205" font-size="17" fill="#314158">grow sorted</text><text x="595" y="235" font-size="17" fill="#314158">prefix</text><text x="815" y="205" font-size="17" fill="#314158">split, sort</text><text x="815" y="235" font-size="17" fill="#314158">then merge</text><text x="1030" y="205" font-size="17" fill="#314158">partition around</text><text x="1030" y="235" font-size="17" fill="#314158">a pivot</text><text x="155" y="310" font-size="19" font-weight="700" fill="#173a75">O(n²)</text><text x="375" y="310" font-size="19" font-weight="700" fill="#1d654e">O(n²)</text><text x="595" y="310" font-size="19" font-weight="700" fill="#8b591d">O(n²) worst</text><text x="815" y="310" font-size="19" font-weight="700" fill="#75386e">O(n log n)</text><text x="1030" y="310" font-size="19" font-weight="700" fill="#873939">O(n log n) avg</text></g><text x="590" y="455" text-anchor="middle" font-size="18" fill="#526176">The teaching goal is not memorising names; it is seeing how each strategy moves data and why the cost differs.</text></g></svg>