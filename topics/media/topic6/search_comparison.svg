<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500"><rect width="1150" height="500" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="575" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Linear Search vs Binary Search</text><rect x="70" y="95" width="470" height="320" rx="24" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="305" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Linear Search</text><text x="110" y="195" font-size="18" fill="#314158">• works on unsorted data</text><text x="110" y="235" font-size="18" fill="#314158">• checks items one by one</text><text x="110" y="275" font-size="18" fill="#314158">• worst case O(n)</text><text x="110" y="315" font-size="18" fill="#314158">• simple and broadly applicable</text><rect x="610" y="95" width="470" height="320" rx="24" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="845" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#1d654e">Binary Search</text><text x="650" y="195" font-size="18" fill="#314158">• requires sorted data</text><text x="650" y="235" font-size="18" fill="#314158">• discards half each step</text><text x="650" y="275" font-size="18" fill="#314158">• worst case O(log n)</text><text x="650" y="315" font-size="18" fill="#314158">• especially natural on arrays</text><text x="575" y="465" text-anchor="middle" font-size="18" fill="#526176">A faster search algorithm may require a stronger precondition: sorted, efficiently indexed data.</text></g></svg>