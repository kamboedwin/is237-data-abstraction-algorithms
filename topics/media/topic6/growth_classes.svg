<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560"><rect width="1150" height="560" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="575" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Common Growth Rates</text><line x1="120" y1="465" x2="1040" y2="465" stroke="#6b7a90" stroke-width="3"/><line x1="120" y1="465" x2="120" y2="100" stroke="#6b7a90" stroke-width="3"/><text x="1040" y="505" font-size="18" fill="#526176">input size n</text><text x="35" y="110" font-size="18" fill="#526176">work</text><path d="M135 430 L1030 430" fill="none" stroke="#3563a8" stroke-width="5"/><text x="900" y="420" font-size="18" fill="#173a75">O(1)</text><path d="M140 420 C300 390 500 350 1030 285" fill="none" stroke="#2b765e" stroke-width="5"/><text x="900" y="285" font-size="18" fill="#1d654e">O(log n)</text><path d="M140 430 L1030 190" fill="none" stroke="#bd7a27" stroke-width="5"/><text x="910" y="180" font-size="18" fill="#8b591d">O(n)</text><path d="M140 445 C420 430 720 320 1030 115" fill="none" stroke="#8d4b86" stroke-width="5"/><text x="890" y="120" font-size="18" fill="#75386e">O(n log n)</text><path d="M140 455 C500 450 780 330 970 105" fill="none" stroke="#b44d4d" stroke-width="5" stroke-dasharray="10 6"/><text x="760" y="120" font-size="18" fill="#873939">O(n²) rises faster</text><text x="575" y="535" text-anchor="middle" font-size="18" fill="#526176">Asymptotic analysis compares how work grows rather than exact running seconds.</text></g></svg>