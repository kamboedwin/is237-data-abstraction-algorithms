<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570"><rect width="1160" height="570" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="580" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">BFS and DFS Explore the Same Graph Differently</text><rect x="60" y="95" width="500" height="390" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="310" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Breadth-First Search</text><text x="110" y="200" font-size="18" fill="#314158">• expands level by level</text><text x="110" y="240" font-size="18" fill="#314158">• uses a Queue</text><text x="110" y="280" font-size="18" fill="#314158">• finds shortest edge-count paths in unweighted graphs</text><text x="110" y="330" font-size="19" font-weight="700" fill="#173a75">A → B, C → D, E, F → ...</text><text x="110" y="390" font-size="18" fill="#314158">Time with adjacency list: O(V + E)</text><rect x="600" y="95" width="500" height="390" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="850" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#1d654e">Depth-First Search</text><text x="650" y="200" font-size="18" fill="#314158">• follows one path deeply</text><text x="650" y="240" font-size="18" fill="#314158">• uses recursion or a Stack</text><text x="650" y="280" font-size="18" fill="#314158">• useful for components, cycles and structural exploration</text><text x="650" y="330" font-size="19" font-weight="700" fill="#1d654e">A → B → D → backtrack → E → ...</text><text x="650" y="390" font-size="18" fill="#314158">Time with adjacency list: O(V + E)</text><text x="580" y="535" text-anchor="middle" font-size="18" fill="#526176">The difference is not which vertices exist; it is how the frontier of unexplored work is managed.</text></g></svg>