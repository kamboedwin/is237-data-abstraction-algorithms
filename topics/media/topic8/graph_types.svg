<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520"><rect width="1180" height="520" rx="30" fill="#fbfcff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3563a8"/></marker></defs><g font-family="Arial,sans-serif"><text x="590" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Common Graph Types</text><rect x="55" y="100" width="250" height="315" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="180" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#173a75">Undirected</text><circle cx="120" cy="235" r="24" fill="#fff" stroke="#3563a8" stroke-width="3"/><circle cx="240" cy="235" r="24" fill="#fff" stroke="#3563a8" stroke-width="3"/><line x1="144" y1="235" x2="216" y2="235" stroke="#3563a8" stroke-width="4"/><text x="180" y="335" text-anchor="middle" font-size="17" fill="#314158">A—B means connection both ways</text><rect x="330" y="100" width="250" height="315" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="455" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#1d654e">Directed</text><circle cx="395" cy="235" r="24" fill="#fff" stroke="#2b765e" stroke-width="3"/><circle cx="515" cy="235" r="24" fill="#fff" stroke="#2b765e" stroke-width="3"/><line x1="419" y1="235" x2="486" y2="235" stroke="#3563a8" stroke-width="4" marker-end="url(#a)"/><text x="455" y="335" text-anchor="middle" font-size="17" fill="#314158">A→B does not imply B→A</text><rect x="605" y="100" width="250" height="315" rx="22" fill="#fff5e7" stroke="#bd7a27" stroke-width="3"/><text x="730" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#8b591d">Weighted</text><circle cx="670" cy="235" r="24" fill="#fff" stroke="#bd7a27" stroke-width="3"/><circle cx="790" cy="235" r="24" fill="#fff" stroke="#bd7a27" stroke-width="3"/><line x1="694" y1="235" x2="766" y2="235" stroke="#bd7a27" stroke-width="4"/><text x="730" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#8b591d">7</text><text x="730" y="335" text-anchor="middle" font-size="17" fill="#314158">edge carries cost/distance/time</text><rect x="880" y="100" width="250" height="315" rx="22" fill="#f4effb" stroke="#8d4b86" stroke-width="3"/><text x="1005" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#75386e">Unweighted</text><circle cx="945" cy="235" r="24" fill="#fff" stroke="#8d4b86" stroke-width="3"/><circle cx="1065" cy="235" r="24" fill="#fff" stroke="#8d4b86" stroke-width="3"/><line x1="969" y1="235" x2="1041" y2="235" stroke="#8d4b86" stroke-width="4"/><text x="1005" y="335" text-anchor="middle" font-size="17" fill="#314158">edges represent equal unit steps</text></g></svg>