<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570"><rect width="1160" height="570" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="580" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Dijkstra's Algorithm: Repeatedly Settle the Nearest Unsettled Vertex</text><g stroke="#9fb4d1" stroke-width="4"><line x1="150" y1="285" x2="350" y2="160"/><line x1="150" y1="285" x2="350" y2="410"/><line x1="350" y1="160" x2="350" y2="410"/><line x1="350" y1="160" x2="620" y2="160"/><line x1="350" y1="410" x2="620" y2="160"/><line x1="350" y1="410" x2="620" y2="410"/><line x1="620" y1="160" x2="620" y2="410"/><line x1="620" y1="160" x2="900" y2="285"/><line x1="620" y1="410" x2="900" y2="285"/></g><g font-size="16" fill="#8b591d" font-weight="700"><text x="245" y="205">4</text><text x="245" y="365">2</text><text x="365" y="290">1</text><text x="490" y="145">5</text><text x="485" y="300">8</text><text x="485" y="430">10</text><text x="640" y="290">2</text><text x="770" y="205">6</text><text x="770" y="365">3</text></g><g fill="#fff" stroke="#3563a8" stroke-width="3"><circle cx="150" cy="285" r="38"/><circle cx="350" cy="160" r="38"/><circle cx="350" cy="410" r="38"/><circle cx="620" cy="160" r="38"/><circle cx="620" cy="410" r="38"/><circle cx="900" cy="285" r="38"/></g><g text-anchor="middle" font-size="20" font-weight="700" fill="#173a75"><text x="150" y="292">A</text><text x="350" y="167">B</text><text x="350" y="417">C</text><text x="620" y="167">D</text><text x="620" y="417">E</text><text x="900" y="292">F</text></g><text x="580" y="515" text-anchor="middle" font-size="18" fill="#526176">For non-negative edge weights: relax neighbouring distances and use a min-priority queue to choose the next nearest vertex.</text></g></svg>