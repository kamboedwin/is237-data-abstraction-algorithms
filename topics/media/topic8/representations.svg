<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600"><rect width="1180" height="600" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="590" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Adjacency List vs Adjacency Matrix</text><rect x="60" y="95" width="500" height="425" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="310" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#173a75">Adjacency List</text><g font-size="20" fill="#314158"><text x="110" y="205">A → B, C</text><text x="110" y="255">B → A, D, E</text><text x="110" y="305">C → A, F</text><text x="110" y="355">D → B</text><text x="110" y="405">E → B, F</text><text x="110" y="455">F → C, E</text></g><text x="310" y="495" text-anchor="middle" font-size="18" fill="#526176">Space: O(V + E) for sparse graphs</text><rect x="620" y="95" width="500" height="425" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="870" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#1d654e">Adjacency Matrix</text><g font-size="17" text-anchor="middle" fill="#314158"><text x="760" y="190">A</text><text x="815" y="190">B</text><text x="870" y="190">C</text><text x="925" y="190">D</text><text x="980" y="190">E</text><text x="1035" y="190">F</text><text x="690" y="225">A</text><text x="690" y="265">B</text><text x="690" y="305">C</text><text x="690" y="345">D</text><text x="690" y="385">E</text><text x="690" y="425">F</text></g><g font-size="18" text-anchor="middle" font-weight="700" fill="#173a75"><text x="760" y="225">0</text><text x="815" y="225">1</text><text x="870" y="225">1</text><text x="925" y="225">0</text><text x="980" y="225">0</text><text x="1035" y="225">0</text><text x="760" y="265">1</text><text x="815" y="265">0</text><text x="870" y="265">0</text><text x="925" y="265">1</text><text x="980" y="265">1</text><text x="1035" y="265">0</text><text x="760" y="305">1</text><text x="815" y="305">0</text><text x="870" y="305">0</text><text x="925" y="305">0</text><text x="980" y="305">0</text><text x="1035" y="305">1</text><text x="760" y="345">0</text><text x="815" y="345">1</text><text x="870" y="345">0</text><text x="925" y="345">0</text><text x="980" y="345">0</text><text x="1035" y="345">0</text><text x="760" y="385">0</text><text x="815" y="385">1</text><text x="870" y="385">0</text><text x="925" y="385">0</text><text x="980" y="385">0</text><text x="1035" y="385">1</text><text x="760" y="425">0</text><text x="815" y="425">0</text><text x="870" y="425">1</text><text x="925" y="425">0</text><text x="980" y="425">1</text><text x="1035" y="425">0</text></g><text x="870" y="495" text-anchor="middle" font-size="18" fill="#526176">Space: O(V²), but edge lookup is O(1)</text><text x="590" y="565" text-anchor="middle" font-size="18" fill="#526176">Representation choice depends strongly on graph density and the operations you need.</text></g></svg>