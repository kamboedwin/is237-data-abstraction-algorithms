<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520"><rect width="1120" height="520" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="560" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">From the Königsberg Bridges Problem to Graph Theory</text><g fill="#eef5ff" stroke="#3563a8" stroke-width="3"><ellipse cx="230" cy="245" rx="100" ry="65"/><ellipse cx="530" cy="145" rx="95" ry="60"/><ellipse cx="530" cy="350" rx="95" ry="60"/><ellipse cx="860" cy="245" rx="100" ry="65"/></g><g stroke="#2b765e" stroke-width="7" fill="none"><path d="M325 220 C380 150 410 150 440 150"/><path d="M325 265 C390 300 420 330 440 340"/><path d="M620 160 C700 180 735 210 765 225"/><path d="M620 335 C700 310 735 280 765 265"/><path d="M255 185 C320 90 435 80 480 100"/><path d="M255 305 C320 420 435 430 480 400"/><path d="M625 245 C700 245 720 245 760 245"/></g><g text-anchor="middle" fill="#173a75" font-size="20" font-weight="700"><text x="230" y="252">land A</text><text x="530" y="152">land B</text><text x="530" y="357">land C</text><text x="860" y="252">land D</text></g><text x="560" y="470" text-anchor="middle" font-size="18" fill="#526176">Euler's 1736 abstraction replaced geography with vertices and bridges with edges — a foundational graph-theory idea.</text></g></svg>