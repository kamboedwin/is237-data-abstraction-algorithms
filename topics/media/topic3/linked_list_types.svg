<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660">
<rect width="1200" height="660" rx="30" fill="#f8fbff"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f9f"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b765e"/></marker>
</defs>
<g font-family="Arial,sans-serif">
<text x="600" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Three Common Types of Linked List</text>

<text x="80" y="105" font-size="24" font-weight="700" fill="#173a75">1. Singly Linked List</text>
<g fill="#fff" stroke="#3563a8" stroke-width="3"><rect x="115" y="130" width="180" height="85" rx="14"/><rect x="400" y="130" width="180" height="85" rx="14"/><rect x="685" y="130" width="180" height="85" rx="14"/></g>
<g text-anchor="middle" font-size="21" font-weight="700" fill="#173a75"><text x="205" y="182">10 | next</text><text x="490" y="182">20 | next</text><text x="775" y="182">30 | null</text></g>
<g stroke="#355f9f" stroke-width="4" marker-end="url(#a)"><line x1="300" y1="172" x2="390" y2="172"/><line x1="585" y1="172" x2="675" y2="172"/></g>
<text x="925" y="175" font-size="18" fill="#526176">One-way traversal</text>

<text x="80" y="300" font-size="24" font-weight="700" fill="#1d654e">2. Doubly Linked List</text>
<g fill="#fff" stroke="#2b765e" stroke-width="3"><rect x="115" y="325" width="200" height="85" rx="14"/><rect x="420" y="325" width="200" height="85" rx="14"/><rect x="725" y="325" width="200" height="85" rx="14"/></g>
<g text-anchor="middle" font-size="19" font-weight="700" fill="#1d654e"><text x="215" y="377">prev | 10 | next</text><text x="520" y="377">prev | 20 | next</text><text x="825" y="377">prev | 30 | next</text></g>
<g stroke="#2b765e" stroke-width="3" marker-end="url(#g)"><line x1="320" y1="353" x2="410" y2="353"/><line x1="415" y1="390" x2="325" y2="390"/><line x1="625" y1="353" x2="715" y2="353"/><line x1="720" y1="390" x2="630" y2="390"/></g>
<text x="985" y="370" font-size="18" fill="#526176">Forward + backward</text>

<text x="80" y="495" font-size="24" font-weight="700" fill="#8b591d">3. Circular Singly Linked List</text>
<g fill="#fff" stroke="#bd7a27" stroke-width="3"><rect x="115" y="520" width="180" height="85" rx="14"/><rect x="400" y="520" width="180" height="85" rx="14"/><rect x="685" y="520" width="180" height="85" rx="14"/></g>
<g text-anchor="middle" font-size="21" font-weight="700" fill="#8b591d"><text x="205" y="572">10 | next</text><text x="490" y="572">20 | next</text><text x="775" y="572">30 | next</text></g>
<g stroke="#bd7a27" stroke-width="4" fill="none" marker-end="url(#a)"><line x1="300" y1="562" x2="390" y2="562"/><line x1="585" y1="562" x2="675" y2="562"/><path d="M865 562 C1020 562 1020 640 200 640 C120 640 100 600 110 575"/></g>
<text x="955" y="570" font-size="18" fill="#526176">Last links back to head</text>
</g></svg>