<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410"><rect width="1000" height="410" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="500" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#17233c">ADT vs Data Structure</text><rect x="75" y="95" width="380" height="235" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="265" y="135" text-anchor="middle" font-size="25" font-weight="700" fill="#173a75">Abstract Data Type</text><text x="105" y="178" font-size="18" fill="#28364e">• What operations are available?</text><text x="105" y="214" font-size="18" fill="#28364e">• What should each operation do?</text><text x="105" y="250" font-size="18" fill="#28364e">• What rules must remain true?</text><text x="105" y="286" font-size="18" fill="#28364e">• What errors or edge cases exist?</text><rect x="545" y="95" width="380" height="235" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="735" y="135" text-anchor="middle" font-size="25" font-weight="700" fill="#1d654e">Data Structure</text><text x="575" y="178" font-size="18" fill="#28364e">• How is data physically organised?</text><text x="575" y="214" font-size="18" fill="#28364e">• Which fields/references are stored?</text><text x="575" y="250" font-size="18" fill="#28364e">• How are operations implemented?</text><text x="575" y="286" font-size="18" fill="#28364e">• What are time/space trade-offs?</text><text x="500" y="375" text-anchor="middle" font-size="18" font-weight="700" fill="#526176">ADT = behaviour contract · Data structure = concrete representation</text></g></svg>