<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="500" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#17233c">Encapsulation and Modular Design</text><rect x="95" y="90" width="810" height="260" rx="24" fill="#fff" stroke="#355f9f" stroke-width="3"/><rect x="125" y="120" width="250" height="200" rx="18" fill="#eef5ff"/><text x="250" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#173a75">Public Interface</text><text x="155" y="195" font-size="17" fill="#34445d">+ add(item)</text><text x="155" y="230" font-size="17" fill="#34445d">+ remove(key)</text><text x="155" y="265" font-size="17" fill="#34445d">+ find(key)</text><text x="155" y="300" font-size="17" fill="#34445d">+ size()</text><rect x="430" y="120" width="440" height="200" rx="18" fill="#f5f1fb"/><text x="650" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#6e438d">Private Implementation</text><text x="460" y="195" font-size="17" fill="#34445d">• internal storage</text><text x="460" y="230" font-size="17" fill="#34445d">• helper operations</text><text x="460" y="265" font-size="17" fill="#34445d">• resize / relink logic</text><text x="460" y="300" font-size="17" fill="#34445d">• representation invariant</text><text x="500" y="395" text-anchor="middle" font-size="17" fill="#526176">Encapsulation protects internal state; modules reduce coupling and make change safer.</text></g></svg>