<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400"><rect width="1000" height="400" rx="30" fill="#f8fbff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f9f"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="48" font-size="30" font-weight="700" fill="#17233c">Interface Hides Implementation</text><rect x="65" y="100" width="250" height="205" rx="20" fill="#fff" stroke="#355f9f" stroke-width="3"/><text x="190" y="138" font-size="23" font-weight="700" fill="#173a75">Client</text><text x="190" y="180" font-size="17" fill="#526176">add(item)</text><text x="190" y="210" font-size="17" fill="#526176">remove(item)</text><text x="190" y="240" font-size="17" fill="#526176">find(key)</text><text x="190" y="270" font-size="17" fill="#526176">size()</text><rect x="375" y="115" width="250" height="175" rx="20" fill="#eef5ff" stroke="#355f9f" stroke-width="3"/><text x="500" y="155" font-size="23" font-weight="700" fill="#173a75">ADT Interface</text><text x="500" y="195" font-size="17" fill="#526176">Public contract</text><text x="500" y="225" font-size="17" fill="#526176">Expected behaviour</text><text x="500" y="255" font-size="17" fill="#526176">Pre/Postconditions</text><rect x="685" y="75" width="250" height="110" rx="20" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="810" y="115" font-size="21" font-weight="700" fill="#1d654e">Implementation A</text><text x="810" y="150" font-size="16" fill="#526176">Array-like representation</text><rect x="685" y="220" width="250" height="110" rx="20" fill="#fff3e6" stroke="#bd7a27" stroke-width="3"/><text x="810" y="260" font-size="21" font-weight="700" fill="#8b591d">Implementation B</text><text x="810" y="295" font-size="16" fill="#526176">Linked-node representation</text><g stroke="#355f9f" stroke-width="4" marker-end="url(#a)"><line x1="320" y1="202" x2="365" y2="202"/><line x1="630" y1="180" x2="675" y2="135"/><line x1="630" y1="225" x2="675" y2="270"/></g><text x="500" y="370" font-size="17" fill="#526176">The client can remain unchanged when the internal implementation changes.</text></g></svg>