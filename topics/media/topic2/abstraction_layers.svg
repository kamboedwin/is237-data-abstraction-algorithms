<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="48" font-size="30" font-weight="700" fill="#17233c">Layers of Abstraction</text><rect x="130" y="90" width="740" height="75" rx="16" fill="#eaf1fb" stroke="#355f9f" stroke-width="3"/><text x="500" y="121" font-size="22" font-weight="700" fill="#173a75">Application</text><text x="500" y="147" font-size="16" fill="#526176">Uses operations without knowing internal representation</text><rect x="180" y="190" width="640" height="75" rx="16" fill="#edf7f4" stroke="#27765c" stroke-width="3"/><text x="500" y="221" font-size="22" font-weight="700" fill="#1d654e">Abstract Data Type (ADT)</text><text x="500" y="247" font-size="16" fill="#526176">Defines behaviour, operations and contracts</text><rect x="230" y="290" width="540" height="75" rx="16" fill="#fff5e7" stroke="#bd7a27" stroke-width="3"/><text x="500" y="321" font-size="22" font-weight="700" fill="#8b591d">Data Structure</text><text x="500" y="347" font-size="16" fill="#526176">Concrete organisation used to realise the ADT</text><rect x="280" y="390" width="440" height="75" rx="16" fill="#f7ebf6" stroke="#8d4b86" stroke-width="3"/><text x="500" y="421" font-size="22" font-weight="700" fill="#75386e">Memory / Storage</text><text x="500" y="447" font-size="16" fill="#526176">Addresses, references and machine representation</text><text x="500" y="500" font-size="16" fill="#627086">Abstraction hides lower-level detail while preserving the operations needed above.</text></g></svg>