<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><rect width="1100" height="600" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="48" font-size="31" font-weight="700" fill="#17233c">Tree Terminology</text><g stroke="#9fb4d1" stroke-width="4"><line x1="550" y1="120" x2="300" y2="235"/><line x1="550" y1="120" x2="800" y2="235"/><line x1="300" y1="255" x2="180" y2="385"/><line x1="300" y1="255" x2="420" y2="385"/><line x1="800" y1="255" x2="680" y2="385"/><line x1="800" y1="255" x2="920" y2="385"/></g><g fill="#fff" stroke="#3563a8" stroke-width="3"><circle cx="550" cy="105" r="55"/><circle cx="300" cy="250" r="50"/><circle cx="800" cy="250" r="50"/><circle cx="180" cy="400" r="45"/><circle cx="420" cy="400" r="45"/><circle cx="680" cy="400" r="45"/><circle cx="920" cy="400" r="45"/></g><g fill="#173a75" font-size="22" font-weight="700"><text x="550" y="112">A</text><text x="300" y="257">B</text><text x="800" y="257">C</text><text x="180" y="407">D</text><text x="420" y="407">E</text><text x="680" y="407">F</text><text x="920" y="407">G</text></g><text x="550" y="185" font-size="18" fill="#1d654e">root</text><text x="300" y="320" font-size="18" fill="#526176">parent of D and E</text><text x="180" y="475" font-size="18" fill="#8b591d">leaf</text><text x="420" y="475" font-size="18" fill="#8b591d">leaf</text><text x="550" y="545" font-size="18" fill="#526176">Depth counts edges from the root; height counts the longest downward path to a leaf.</text></g></svg>