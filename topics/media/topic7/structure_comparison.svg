<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500"><rect width="1180" height="500" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="590" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">BST, Heap and Hash Table Serve Different Priorities</text><rect x="60" y="105" width="330" height="300" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="225" y="150" text-anchor="middle" font-size="25" font-weight="700" fill="#173a75">BST</text><text x="95" y="205" font-size="18" fill="#314158">✓ ordered search structure</text><text x="95" y="245" font-size="18" fill="#314158">✓ inorder traversal is sorted</text><text x="95" y="285" font-size="18" fill="#314158">△ can become skewed</text><text x="95" y="335" font-size="18" font-weight="700" fill="#173a75">Typical balanced: O(log n)</text><rect x="425" y="105" width="330" height="300" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="590" y="150" text-anchor="middle" font-size="25" font-weight="700" fill="#1d654e">Heap</text><text x="460" y="205" font-size="18" fill="#314158">✓ fast access to min/max</text><text x="460" y="245" font-size="18" fill="#314158">✓ priority queue</text><text x="460" y="285" font-size="18" fill="#314158">△ not fully sorted</text><text x="460" y="335" font-size="18" font-weight="700" fill="#1d654e">insert/extract: O(log n)</text><rect x="790" y="105" width="330" height="300" rx="22" fill="#fff5e7" stroke="#bd7a27" stroke-width="3"/><text x="955" y="150" text-anchor="middle" font-size="25" font-weight="700" fill="#8b591d">Hash Table</text><text x="825" y="205" font-size="18" fill="#314158">✓ fast key lookup average</text><text x="825" y="245" font-size="18" fill="#314158">✓ direct key → bucket idea</text><text x="825" y="285" font-size="18" fill="#314158">△ no natural sorted order</text><text x="825" y="335" font-size="18" font-weight="700" fill="#8b591d">average lookup: O(1)</text><text x="590" y="465" text-anchor="middle" font-size="18" fill="#526176">Choose from the dominant operation: ordered search, priority access, or key-based lookup.</text></g></svg>