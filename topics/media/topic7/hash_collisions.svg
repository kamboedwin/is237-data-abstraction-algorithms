<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570"><rect width="1160" height="570" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="580" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Hash Collisions and Two Resolution Strategies</text><text x="120" y="112" font-size="22" font-weight="700" fill="#173a75">Separate chaining</text><g fill="#fff" stroke="#3563a8" stroke-width="3"><rect x="120" y="145" width="130" height="62" rx="10"/><rect x="120" y="217" width="130" height="62" rx="10"/><rect x="120" y="289" width="130" height="62" rx="10"/><rect x="120" y="361" width="130" height="62" rx="10"/></g><g font-size="19" font-weight="700" fill="#173a75"><text x="165" y="183">0</text><text x="165" y="255">1</text><text x="165" y="327">2</text><text x="165" y="399">3</text></g><g stroke="#2b765e" stroke-width="3"><line x1="250" y1="248" x2="340" y2="248"/><line x1="440" y1="248" x2="520" y2="248"/></g><g fill="#eef8f4" stroke="#2b765e" stroke-width="3"><rect x="340" y="217" width="100" height="62" rx="10"/><rect x="520" y="217" width="100" height="62" rx="10"/></g><text x="390" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#1d654e">21</text><text x="570" y="255" text-anchor="middle" font-size="18" font-weight="700" fill="#1d654e">41</text><text x="700" y="112" font-size="22" font-weight="700" fill="#8b591d">Open addressing — linear probing</text><g fill="#fff" stroke="#bd7a27" stroke-width="3"><rect x="700" y="155" width="105" height="75" rx="10"/><rect x="815" y="155" width="105" height="75" rx="10"/><rect x="930" y="155" width="105" height="75" rx="10"/><rect x="700" y="245" width="105" height="75" rx="10"/><rect x="815" y="245" width="105" height="75" rx="10"/><rect x="930" y="245" width="105" height="75" rx="10"/></g><g text-anchor="middle"><text x="752" y="184" font-size="15" fill="#526176">0</text><text x="867" y="184" font-size="15" fill="#526176">1</text><text x="982" y="184" font-size="15" fill="#526176">2</text><text x="752" y="274" font-size="15" fill="#526176">3</text><text x="867" y="274" font-size="15" fill="#526176">4</text><text x="982" y="274" font-size="15" fill="#526176">5</text><text x="867" y="215" font-size="20" font-weight="700" fill="#8b591d">21</text><text x="982" y="215" font-size="20" font-weight="700" fill="#8b591d">41</text></g><text x="580" y="500" text-anchor="middle" font-size="18" fill="#526176">A collision means different keys map to the same initial table index; it must be handled, not treated as an error.</text></g></svg>