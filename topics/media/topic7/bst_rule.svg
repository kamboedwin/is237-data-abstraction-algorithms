<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="48" font-size="31" font-weight="700" fill="#17233c">Binary Search Tree Ordering Rule</text><g stroke="#9fb4d1" stroke-width="4"><line x1="550" y1="135" x2="320" y2="265"/><line x1="550" y1="135" x2="780" y2="265"/><line x1="320" y1="285" x2="200" y2="410"/><line x1="320" y1="285" x2="440" y2="410"/><line x1="780" y1="285" x2="660" y2="410"/><line x1="780" y1="285" x2="900" y2="410"/></g><g fill="#fff" stroke="#3563a8" stroke-width="3"><circle cx="550" cy="120" r="58"/><circle cx="320" cy="280" r="52"/><circle cx="780" cy="280" r="52"/><circle cx="200" cy="425" r="46"/><circle cx="440" cy="425" r="46"/><circle cx="660" cy="425" r="46"/><circle cx="900" cy="425" r="46"/></g><g font-size="23" font-weight="700" fill="#173a75"><text x="550" y="128">50</text><text x="320" y="288">30</text><text x="780" y="288">70</text><text x="200" y="433">20</text><text x="440" y="433">40</text><text x="660" y="433">60</text><text x="900" y="433">80</text></g><text x="310" y="185" font-size="20" font-weight="700" fill="#1d654e">left subtree &lt; node</text><text x="790" y="185" font-size="20" font-weight="700" fill="#8b591d">right subtree &gt; node</text><text x="550" y="525" font-size="18" fill="#526176">When the tree remains reasonably balanced, search, insertion and deletion are typically O(log n).</text></g></svg>