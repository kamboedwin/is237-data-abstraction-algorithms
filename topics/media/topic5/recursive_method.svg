<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470"><rect width="1100" height="470" rx="30" fill="#f8fbff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f9f"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="48" font-size="31" font-weight="700" fill="#17233c">Designing a Recursive Method</text><g fill="#fff" stroke="#3563a8" stroke-width="3"><rect x="70" y="125" width="210" height="110" rx="18"/><rect x="315" y="125" width="210" height="110" rx="18"/><rect x="560" y="125" width="210" height="110" rx="18"/><rect x="805" y="125" width="225" height="110" rx="18"/></g><g font-size="20" font-weight="700" fill="#173a75"><text x="175" y="170">1. Smaller</text><text x="175" y="198">subproblem</text><text x="420" y="170">2. Base</text><text x="420" y="198">case</text><text x="665" y="170">3. Progress</text><text x="665" y="198">toward base</text><text x="918" y="170">4. Combine</text><text x="918" y="198">result</text></g><g stroke="#355f9f" stroke-width="4" marker-end="url(#a)"><line x1="285" y1="180" x2="305" y2="180"/><line x1="530" y1="180" x2="550" y2="180"/><line x1="775" y1="180" x2="795" y2="180"/></g><text x="550" y="310" font-size="22" font-weight="700" fill="#8b591d">Every recursive path must eventually reach a stopping condition.</text><text x="550" y="360" font-size="18" fill="#526176">If the problem does not get smaller or simpler, recursion does not terminate correctly.</text></g></svg>