<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520"><rect width="1160" height="520" rx="30" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="580" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Recursion and Iteration: Two Ways to Repeat Work</text><rect x="70" y="90" width="470" height="335" rx="24" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="305" y="132" text-anchor="middle" font-size="27" font-weight="700" fill="#173a75">Recursion</text><text x="110" y="180" font-size="18" fill="#314158">• function solves a smaller version of itself</text><text x="110" y="220" font-size="18" fill="#314158">• requires a base case</text><text x="110" y="260" font-size="18" fill="#314158">• uses the call stack</text><text x="110" y="300" font-size="18" fill="#314158">• natural for trees and divide-and-conquer</text><text x="110" y="340" font-size="18" fill="#314158">• can risk deep-stack growth</text><text x="110" y="390" font-size="20" font-weight="700" fill="#173a75">Problem → smaller problem → base case</text><rect x="620" y="90" width="470" height="335" rx="24" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="855" y="132" text-anchor="middle" font-size="27" font-weight="700" fill="#1d654e">Iteration</text><text x="660" y="180" font-size="18" fill="#314158">• repeats using a loop</text><text x="660" y="220" font-size="18" fill="#314158">• requires a loop condition</text><text x="660" y="260" font-size="18" fill="#314158">• stores state explicitly</text><text x="660" y="300" font-size="18" fill="#314158">• often memory-efficient</text><text x="660" y="340" font-size="18" fill="#314158">• can be clearer for simple repetition</text><text x="660" y="390" font-size="20" font-weight="700" fill="#1d654e">Initial state → loop → stopping condition</text><text x="580" y="480" text-anchor="middle" font-size="18" fill="#526176">Neither is universally better: choose the form that makes the problem correct, clear and practical.</text></g></svg>