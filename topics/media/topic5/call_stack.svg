<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560"><rect width="1050" height="560" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="525" y="50" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Recursive Calls Use the Call Stack</text><g fill="#fff" stroke="#3563a8" stroke-width="3"><rect x="340" y="380" width="370" height="70" rx="12"/><rect x="340" y="300" width="370" height="70" rx="12"/><rect x="340" y="220" width="370" height="70" rx="12"/><rect x="340" y="140" width="370" height="70" rx="12"/></g><g text-anchor="middle" font-size="21" fill="#173a75" font-weight="700"><text x="525" y="423">factorial(4): waits for factorial(3)</text><text x="525" y="343">factorial(3): waits for factorial(2)</text><text x="525" y="263">factorial(2): waits for factorial(1)</text><text x="525" y="183">factorial(1): base case returns</text></g><text x="770" y="185" font-size="18" font-weight="700" fill="#1d654e">TOP</text><text x="525" y="505" text-anchor="middle" font-size="18" fill="#526176">Returns occur in reverse order because the call stack is LIFO.</text></g></svg>