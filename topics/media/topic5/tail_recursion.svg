<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460"><rect width="1120" height="460" rx="30" fill="#fbfcff"/><g font-family="Arial,sans-serif"><text x="560" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#17233c">Tail Recursion: The Recursive Call Is the Final Action</text><rect x="70" y="105" width="430" height="250" rx="22" fill="#eef5ff" stroke="#3563a8" stroke-width="3"/><text x="285" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#173a75">Non-tail factorial</text><text x="110" y="195" font-size="18" fill="#314158">return n × factorial(n - 1)</text><text x="110" y="245" font-size="18" fill="#314158">Multiplication remains after return.</text><text x="110" y="295" font-size="18" fill="#314158">Pending work must be remembered.</text><rect x="620" y="105" width="430" height="250" rx="22" fill="#eef8f4" stroke="#2b765e" stroke-width="3"/><text x="835" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#1d654e">Tail-recursive factorial</text><text x="660" y="195" font-size="18" fill="#314158">return factTail(n - 1, n × acc)</text><text x="660" y="245" font-size="18" fill="#314158">Recursive call is the last action.</text><text x="660" y="295" font-size="18" fill="#314158">State moves into accumulator.</text><text x="560" y="410" text-anchor="middle" font-size="18" fill="#526176">Tail-call optimisation depends on the language/runtime.</text></g></svg>